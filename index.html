<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级积分管理系统</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- SheetJS for Excel export/import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🌈</span>
                    <span class="logo-text">班级积分系统</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="#home" class="nav-item active" data-page="home">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">首页</span>
                </a>
                <a href="#groups" class="nav-item" data-page="groups">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">小组管理</span>
                </a>
                <a href="#ranking" class="nav-item" data-page="ranking">
                    <span class="nav-icon">🏆</span>
                    <span class="nav-text">排行榜</span>
                </a>
                <a href="#timeline" class="nav-item" data-page="timeline">
                    <span class="nav-icon">📅</span>
                    <span class="nav-text">积分时间线</span>
                </a>
                <a href="#analysis" class="nav-item" data-page="analysis">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">数据分析</span>
                </a>
                <a href="#shop" class="nav-item" data-page="shop">
                    <span class="nav-icon">🛒</span>
                    <span class="nav-text">积分商城</span>
                </a>
                <a href="#rules" class="nav-item" data-page="rules">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">积分规则</span>
                </a>
                <a href="#tools" class="nav-item" data-page="tools">
                    <span class="nav-icon">🧰</span>
                    <span class="nav-text">工具箱</span>
                </a>
                <a href="#settings" class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">系统设置</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="class-info" id="classInfo">
                    <span class="class-name">我的班级</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="menu-toggle" id="menuToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <h1 class="page-title" id="pageTitle">首页</h1>
                <div class="header-actions">
                    <button class="btn btn-icon" id="refreshBtn" title="刷新">🔄</button>
                </div>
            </header>

            <!-- Page Container -->
            <div class="page-container" id="pageContainer">
                <!-- Pages will be rendered here -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">标题</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content here -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Modal buttons here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="js/store.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/router.js"></script>
    <script src="js/modules/home.js"></script>
    <script src="js/modules/groups.js"></script>
    <script src="js/modules/ranking.js"></script>
    <script src="js/modules/timeline.js"></script>
    <script src="js/modules/analysis.js"></script>
    <script src="js/modules/shop.js"></script>
    <script src="js/modules/rules.js"></script>
    <script src="js/modules/tools.js"></script>
    <script src="js/modules/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
